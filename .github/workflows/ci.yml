name: 🔍 CI - Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_VERSION: "15"
  REDIS_VERSION: "7"

jobs:
  lint:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest

    if: github.actor != 'Rayyan-Shk'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: 🔧 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort mypy
          pip install -r requirements.txt

      - name: 🎨 Format Check (Black)
        run: black --check --diff src/ tests/ main.py init_db.py

      - name: 📋 Import Sort Check (isort)
        run: isort --check-only --diff src/ tests/ main.py init_db.py

      - name: 🔍 Lint Check (Flake8)
        run: flake8 src/ --max-line-length=88 --extend-ignore=E203,W503

      - name: 🔬 Type Check (MyPy)
        run: mypy src/ --ignore-missing-imports

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    # Skip tests for Rayyan-Shk pushes, run after lint job succeeds for others
    needs: [lint]
    if: github.actor != 'Rayyan-Shk' && needs.lint.result == 'success'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ship_planning_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-

      - name: 🔧 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Setup Test Database
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ship_planning_test
          REDIS_URL: redis://localhost:6379/0
          WEATHER_API_KEY: test_key
          SECRET_KEY: test-secret-key
        run: |
          python init_db.py

      - name: 🧪 Run Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ship_planning_test
          REDIS_URL: redis://localhost:6379/0
          WEATHER_API_KEY: test_key
          SECRET_KEY: test-secret-key
          DEBUG: true
          ENVIRONMENT: test
        run: |
          pytest --cov=src --cov-report=xml --cov-report=html -v

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Install Safety
        run: pip install safety bandit

      - name: 🛡️ Check Dependencies (Safety)
        run: safety check --json
        continue-on-error: true

      - name: 🔍 Security Lint (Bandit)
        run: bandit -r src/ -f json
        continue-on-error: true
