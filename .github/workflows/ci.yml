name: 🔍 CI - Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_VERSION: "15"
  REDIS_VERSION: "7"

jobs:
  auto-format:
    name: 🎨 Auto-Format Code
    runs-on: ubuntu-latest
    # Only run on push events, not PRs
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Install Formatters
        run: |
          python -m pip install --upgrade pip
          pip install black isort

      - name: 🎨 Format Code with Black
        run: black src/ tests/ main.py init_db.py

      - name: 📋 Sort Imports with isort
        run: isort src/ tests/ main.py init_db.py

      - name: 📝 Check for Changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Files were formatted"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No formatting changes needed"
          fi

      - name: 🚀 Commit and Push Changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "style: auto-format code with Black and isort [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/Rayyan-Shk/voyage-optimizer.git HEAD:main

  lint:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    # Run after auto-format job completes (for push) or immediately (for PRs)
    needs: [auto-format]
    if: always() && (needs.auto-format.result == 'success' || needs.auto-format.result == 'skipped')

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          # Fetch the latest commit (including auto-format changes)
          ref: ${{ github.ref }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: 🔧 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort mypy
          pip install -r requirements.txt

      - name: 🎨 Format Check (Black)
        run: black --check --diff src/ tests/ main.py init_db.py

      - name: 📋 Import Sort Check (isort)
        run: isort --check-only --diff src/ tests/ main.py init_db.py

      - name: 🔍 Lint Check (Flake8)
        run: flake8 src/ --max-line-length=88 --extend-ignore=E203,W503

      - name: 🔬 Type Check (MyPy)
        run: mypy src/ --ignore-missing-imports

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    # Run after lint job
    needs: [lint]
    if: always()

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ship_planning_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-

      - name: 🔧 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Setup Test Database
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ship_planning_test
          REDIS_URL: redis://localhost:6379/0
          WEATHER_API_KEY: test_key
          SECRET_KEY: test-secret-key
        run: |
          python init_db.py

      - name: 🧪 Run Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ship_planning_test
          REDIS_URL: redis://localhost:6379/0
          WEATHER_API_KEY: test_key
          SECRET_KEY: test-secret-key
          DEBUG: true
          ENVIRONMENT: test
        run: |
          pytest --cov=src --cov-report=xml --cov-report=html -v

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Install Safety
        run: pip install safety bandit

      - name: 🛡️ Check Dependencies (Safety)
        run: safety check --json
        continue-on-error: true

      - name: 🔍 Security Lint (Bandit)
        run: bandit -r src/ -f json
        continue-on-error: true
