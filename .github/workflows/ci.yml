name: 🔍 CI - Lint & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_VERSION: "15"
  REDIS_VERSION: "7"

jobs:
  auto-format:
    name: 🎨 Auto-Format Code
    runs-on: ubuntu-latest
    # Only run on push events, not PRs
    if: github.event_name == 'push'
    outputs:
      formatted: ${{ steps.check-changes.outputs.formatted }}
      commit_sha: ${{ steps.get-commit.outputs.commit_sha }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Install Formatters
        run: |
          python -m pip install --upgrade pip
          pip install black isort

      - name: 🎨 Format Code with Black
        run: black src/ tests/ main.py init_db.py

      - name: 📋 Sort Imports with isort
        run: isort src/ tests/ main.py init_db.py

      - name: 📝 Check for Changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "formatted=true" >> $GITHUB_OUTPUT
            echo "Files were formatted"
          else
            echo "formatted=false" >> $GITHUB_OUTPUT
            echo "No formatting changes needed"
          fi

      - name: 🚀 Commit and Push Changes
        if: steps.check-changes.outputs.formatted == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "style: auto-format code with Black and isort [skip ci]"
          git push

      - name: 🔍 Get Latest Commit SHA
        id: get-commit
        run: |
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  lint:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    needs: [auto-format]
    # Always run for PRs, or run for pushes only if auto-format completed successfully
    if: >
      always() && 
      (github.event_name == 'pull_request' || 
       (github.event_name == 'push' && needs.auto-format.result == 'success'))

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          # If auto-format made changes, checkout the formatted commit
          ref: ${{ github.event_name == 'push' && needs.auto-format.outputs.formatted == 'true' && needs.auto-format.outputs.commit_sha || github.sha }}
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-

      - name: 🔧 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort mypy
          pip install -r requirements.txt

      - name: 🎨 Format Check (Black)
        run: black --check --diff src/ tests/ main.py init_db.py

      - name: 📋 Import Sort Check (isort)
        run: isort --check-only --diff src/ tests/ main.py init_db.py

      - name: 🔍 Lint Check (Flake8)
        run: flake8 src/ --max-line-length=88 --extend-ignore=E203,W503

      - name: 🔬 Type Check (MyPy)
        run: mypy src/ --ignore-missing-imports

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    # Run after lint job succeeds
    needs: [lint]
    if: needs.lint.result == 'success'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ship_planning_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-

      - name: 🔧 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Setup Test Database
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ship_planning_test
          REDIS_URL: redis://localhost:6379/0
          WEATHER_API_KEY: test_key
          SECRET_KEY: test-secret-key
        run: |
          python init_db.py

      - name: 🧪 Run Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/ship_planning_test
          REDIS_URL: redis://localhost:6379/0
          WEATHER_API_KEY: test_key
          SECRET_KEY: test-secret-key
          DEBUG: true
          ENVIRONMENT: test
        run: |
          pytest --cov=src --cov-report=xml --cov-report=html -v

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 🔧 Install Safety
        run: pip install safety bandit

      - name: 🛡️ Check Dependencies (Safety)
        run: safety check --json
        continue-on-error: true

      - name: 🔍 Security Lint (Bandit)
        run: bandit -r src/ -f json
        continue-on-error: true
